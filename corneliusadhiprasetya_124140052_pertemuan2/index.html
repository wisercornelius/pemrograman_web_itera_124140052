<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Jadwal dan Tugas Kuliah</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <div class="brand">
        <div class="logo">JT</div>
        <div>
          <h1>Dashboard Jadwal dan Tugas Kuliah</h1>
          <p class="sub">Cornelius Adhi Prasetya • NIM 124140052 • Praktikum PAW Pertemuan 2</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container layout">
    <!-- Jadwal Kuliah -->
    <section class="card">
      <div class="card-head">
        <h2>📅 Jadwal Kuliah</h2>
        <span class="pill" id="jadwalCount">0</span>
      </div>

      <form id="formJadwal" class="item-form" novalidate>
        <input type="hidden" id="jadwalId" />
        <label class="field">
          Mata Kuliah
          <input type="text" id="jadwalMatkul" placeholder="Contoh: Pemrograman Web" />
          <small class="error" id="errMatkul"></small>
        </label>
        <div class="grid2">
          <label class="field">
            Hari
            <select id="jadwalHari">
              <option value="Senin">Senin</option>
              <option value="Selasa">Selasa</option>
              <option value="Rabu">Rabu</option>
              <option value="Kamis">Kamis</option>
              <option value="Jumat">Jumat</option>
              <option value="Sabtu">Sabtu</option>
            </select>
          </label>
          <label class="field">
            Ruang / Kelas
            <input type="text" id="jadwalRuang" placeholder="Contoh: Lab T.2.3" />
          </label>
        </div>
        <div class="grid2">
          <label class="field">
            Jam Mulai
            <input type="time" id="jadwalJamMulai" />
            <small class="error" id="errJamMulai"></small>
          </label>
          <label class="field">
            Jam Selesai
            <input type="time" id="jadwalJamSelesai" />
            <small class="error" id="errJamSelesai"></small>
          </label>
        </div>
        <button class="btn primary" type="submit" id="btnJadwal">+ Tambah Jadwal</button>
        <button class="btn ghost hidden" type="button" id="btnJadwalBatal">Batal Edit</button>
      </form>

      <ul class="list" id="listJadwal"></ul>
    </section>

    <!-- Daftar Tugas -->
    <section class="card">
      <div class="card-head">
        <h2>📝 Daftar Tugas</h2>
        <span class="pill" id="tugasCount">0</span>
      </div>

      <form id="formTugas" class="item-form" novalidate>
        <input type="hidden" id="tugasId" />
        <label class="field">
          Judul Tugas
          <input type="text" id="tugasJudul" placeholder="Contoh: Laporan Praktikum 3" />
          <small class="error" id="errJudul"></small>
        </label>
        <div class="grid2">
          <label class="field">
            Mata Kuliah
            <input type="text" id="tugasMatkul" placeholder="Contoh: Pemrograman Web" />
          </label>
          <label class="field">
            Prioritas
            <select id="tugasPrioritas">
              <option value="Tinggi">🔴 Tinggi</option>
              <option value="Sedang" selected>🟡 Sedang</option>
              <option value="Rendah">🟢 Rendah</option>
            </select>
          </label>
        </div>
        <label class="field">
          Tenggat
          <input type="date" id="tugasTenggat" />
          <small class="error" id="errTenggat"></small>
        </label>
        <button class="btn primary" type="submit" id="btnTugas">+ Tambah Tugas</button>
        <button class="btn ghost hidden" type="button" id="btnTugasBatal">Batal Edit</button>
      </form>

      <div class="toolbar">
        <label class="check"><input type="checkbox" id="filterHideDone" /> Sembunyikan yang selesai</label>
        <span class="muted" id="progressText">0/0 selesai</span>
        <button class="btn ghost small" id="btnSeed" type="button">Muat Contoh (API)</button>
      </div>
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

      <ul class="list" id="listTugas"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
